[package]
name = "luau-shield"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Static taint analysis that finds exploitable vulnerabilities in Roblox games written in Luau"
license = "MIT"
repository = "https://github.com/Topogamer0/luau-shield"
homepage = "https://github.com/Topogamer0/luau-shield"
readme = "README.md"
keywords = ["roblox", "luau", "security", "static-analysis", "taint"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/examples", "/tests/fixtures", "/.github"]

[[bin]]
name = "luau-shield"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive"] }
full_moon = { version = "3.0.0", features = ["luau"] }
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false }
walkdir = "2"

[dev-dependencies]
insta = "1"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
